<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiroredSMP - Official Website</title>
    <style>
        /* Desain Tampilan (CSS) */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Warna latar gelap */
            color: #ffffff;
            text-align: center;
        }
        .hero {
            padding: 120px 20px;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border-bottom: 4px solid #ff4757; /* Aksen garis merah */
        }
        h1 {
            font-size: 3.5em;
            margin-bottom: 10px;
            color: #ff4757; /* Warna teks judul MiroredSMP */
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        p {
            font-size: 1.2em;
            color: #cccccc;
        }
        .ip-box {
            background-color: #2f3542;
            display: inline-block;
            padding: 20px 40px;
            border-radius: 10px;
            margin-top: 30px;
            border: 1px solid #57606f;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.5);
        }
        .ip-text {
            font-size: 1.8em;
            font-weight: bold;
            color: #1dd1a1; /* Warna teks IP hijau neon */
            letter-spacing: 1px;
        }
        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            margin-top: 20px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #ff6b81; /* Warna tombol saat disentuh */
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Bagian Utama Web (HTML) -->
    <div class="hero">
        <h1>MiroredSMP</h1>
        <p>Server Survival Multiplayer Terbaik untuk Java & Bedrock Edition!</p>
        
        <div class="ip-box">
            <p style="margin: 0 0 10px 0; font-size: 1em;">Alamat IP Server:</p>
            <div class="ip-text" id="serverIP">miroredsmp.my.id</div>
            <p style="font-size: 0.9em; margin-top: 10px; color: #a4b0be;">Port Bedrock: 2045</p>
            
            <button class="btn" onclick="copyIP()">Salin IP Server</button>
        </div>
    </div>

    <!-- Fitur Fungsi Tombol (JavaScript) -->
    <script>
        function copyIP() {
            var copyText = document.getElementById("serverIP").innerText;
            navigator.clipboard.writeText(copyText);
            alert("Berhasil! IP Server (" + copyText + ") sudah disalin. Selamat bermain!");
        }
    </script>

</body>
</html>
